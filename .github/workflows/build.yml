name: Build FeatherMC

# Builds the plugin jar with Maven any time you push, open a PR, or trigger
# it manually. The finished jar is attached to the workflow run as a
# downloadable artifact - no need to have Java/Maven installed locally.
on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Locate built jar
        id: jar
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -n 1)
          echo "Found jar: $JAR_PATH"
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload jar artifact
        uses:
